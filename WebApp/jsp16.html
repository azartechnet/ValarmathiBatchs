<script>
    function sample() {
            p1 = parseInt(prompt("Enter the p1 value is::"))
            if (p1 % 2 == 0) {
                document.write("Its is even" + p1)
            }
            else {
                document.write("Its is odd" + p1)
            }
        }
    function sample1() {
            n = parseInt(prompt("Enter the n value is::"))
            for (i = 0; i <= n; i++) {
                document.write("I value is::" + i)
            }
        }
</script>
<button type="button" onclick="sample()">ClickHere</button>
<button type="button" onclick="sample1()">Sample1</button>
