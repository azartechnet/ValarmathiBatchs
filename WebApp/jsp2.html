<script>
    var a=parseInt(prompt("Enter the a value is::"))
    var b=parseInt(prompt("Enter the b value is::"))
    document.write("Arithmetic Operators")
    document.write("Add::"+(a+b))
    document.write("Sub::"+(a-b))
    document.write("Mul::"+(a*b))
    document.write("Div::"+(a/b))
    document.write("Assignment Operators")
    document.write(a+=5);
    document.write("RelationalOperator")
    document.write("Lessthan::"+(a<b))
    document.write("Greather::"+(a>b))
    document.write("Equal to::"+(a==b))
    document.write("NotEqual::"+(a!=b))
    document.writeln("LogicalOperator")
    document.write("LogicalAND::"+((a>b)&&(b<a)))
    document.write("LogicalOR::"+(a>b)||(b>a))
    document.write("LogicalNOT::"+!(a>b))
    



</script>
