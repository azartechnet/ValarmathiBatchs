<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
  body { background: #f5f7fa; }
  .auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 2.5rem;
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .auth-card .form-control {
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
  }
  .auth-card .form-control:focus {
    box-shadow: 0 0 0 3px rgba(13,202,240,0.15);
    border-color: #0dcaf0;
  }
  .btn-auth {
    background: #0dcaf0;
    border: none;
    border-radius: 8px;
    padding: 0.65rem;
    font-weight: 500;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn-auth:hover { background: #0bb5d8; transform: translateY(-1px); }
  .auth-icon-circle {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(13,202,240,0.12);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 1.5rem;
    color: #0dcaf0;
  }
</style>

<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-icon-circle"><i class="bi bi-person-circle"></i></div>
    <h4 class="text-center mb-1">Welcome back</h4>
    <p class="text-center text-muted small mb-4">Log in to continue to your account</p>

    <form>
      <div class="mb-3">
        <label class="form-label small">Email address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label small" for="remember">Remember me</label>
        </div>
        <a href="#" class="small text-decoration-none">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-auth w-100 text-white">Log in</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      Don't have an account? <a href="register.html" class="text-decoration-none">Register</a>
    </p>
  </div>
</div>
